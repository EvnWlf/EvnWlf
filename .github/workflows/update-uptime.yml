name: Update Profile Uptime

on:
  schedule:
    - cron: '0 0 * * *' # Actualización diaria automática
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar terminal.svg
        run: node generate.js

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile uptime [skip ci]" && git push)
